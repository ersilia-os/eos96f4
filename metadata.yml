Title: Digitization of molecular complexity
Description: Quantifies how complex a molecule appears to an experienced 
  chemist, learned from expert judgements rather than defined by a formula. The 
  authors framed this as learning to rank, training on pairwise complexity 
  comparisons, and used Shapley analysis to identify which structural 
  characteristics drive the assessments, among them ring fusion, stereocentres 
  and unusual heteroatom arrangements. Because the target is human perception, 
  the score reflects the intuitions of the chemists who supplied the rankings.
